          <p>Purity in Every Bite, Swadam in Every Snack! Order fresh traditional Maharashtrian tea-time savories, hand-rolled Shankarpali, and crispy Special Poha Chivda prepared fresh in 100% refined rice bran oil by Vidya Dandekar in Dhayari, Pune, Maharashtra. We cater to daily snack orders, bulk catering for family functions, wedding faral boxes, birthdays, and corporate gifting across Pune.</p>

        <section id="products">
          <h2>Our Flagship Speciality: Premium Patal Poha Chivda in Pune</h2>
          <p>Handcrafted fresh on order using paper-thin flaked rice, premium whole cashews, roasted peanuts, dry coconut slices, and fresh curry leaves tempered in 100% refined rice bran oil.</p>

          <article>
            <h3>Premium Patal Poha Chivda (प्रीमियम पातळ पोहा चिवडा)</h3>
            <p>Crispy thin paper poha gently pan-roasted and seasoned with whole cashews, peanuts, coconut slices, green chillies, and Vidya Dandekar's signature Pune spice mix in 100% refined rice bran oil. Zero vanaspati, zero preservatives. Available in 1 Pack of 200g (₹90, incl. 5% GST), 2 Packs of 200g (₹180), 3 Packs of 200g (₹270), and 1kg Saver Box with 5 Packs (₹450).</p>
          </article>
        </section>

        <section id="pillars">
          <h2>Our 4 Pillars of Purity &amp; Culinary Excellence</h2>
          <ul>
            <li><strong>100% Homemade by Vidya Dandekar:</strong> Prepared in a clean home kitchen in Dhayari, Pune with motherly care and absolute hygiene.</li>
            <li><strong>Fresh Preparation on Order:</strong> Every batch is prepared fresh in small quantities to ensure maximum crispness and zero staleness.</li>
            <li><strong>100% Refined Rice Bran Oil:</strong> Heart-healthy oil rich in natural antioxidants (oryzanol) with zero vanaspati, zero artificial butter, and zero chemical preservatives.</li>
            <li><strong>Seamless Ordering &amp; Express Pune Delivery:</strong> Instant WhatsApp bag builder with doorstep delivery across Dhayari, Sinhagad Road, Kothrud, Baner, Aundh, Hadapsar, Viman Nagar, and all Pune areas.</li>
          </ul>

        <section id="about">
          <h2>The Swadam Foods Brand Story &amp; Recipe Tradition</h2>
          <p>Founded by Vidya Dandekar in Dhayari, Pune, Swadam Foods is dedicated to preserving the rich culinary heritage of authentic Maharashtrian tea-time snacks and festive faral boxes. What started as handcrafted delicacies for family gatherings and festival celebrations has grown into a beloved local brand trusted by hundreds of Pune families.</p>
          <p>Vidya Dandekar shares: "As a homemaker, I understand that food is about safety, trust, and sharing absolute warmth. I use only pure wheat flour, 100% refined rice bran oil, and hand-ground whole spices. We never add chemical preservatives, artificial food colorings, or baking soda."</p>
        </section>

        <section id="faq">
          <h2>Frequently Asked Questions (FAQ)</h2>
          <article>
            <h3>Are Swadam Foods snacks prepared fresh on order?</h3>
            <p>Yes, our Premium Patal Poha Chivda is prepared fresh in small batches upon receiving your order.</p>
          </article>

          <article>
            <h3>What oil is used for cooking?</h3>
            <p>We strictly use 100% high-grade refined rice bran oil, which is heart-healthy, non-greasy, and rich in natural antioxidants. We do not use vanaspati or artificial butter.</p>
          </article>

          <article>
            <h3>What is the shelf life of the snacks?</h3>
            <p>When stored in an airtight container in a dry place, Poha Chivda stays crispy for 4 to 6 weeks, while Shankarpali remains fresh for 3 to 4 weeks.</p>
          </article>

          <article>
            <h3>Do you accept bulk orders for weddings, corporate gifting, and festivals in Pune?</h3>
            <p>Yes! We specialize in bulk orders for wedding faral boxes, corporate gifting, birthdays, Diwali, and Ganesh Chaturthi celebrations across Dhayari, Sinhagad Road, and all Pune localities.</p>
          </article>
